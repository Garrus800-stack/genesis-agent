name: CI

# v7.9.48: until now .github/ held issue and pull-request templates and no
# workflow at all. A 27-link chain that only runs when someone remembers to
# type `npm run ci:full` is not continuous integration — it is a habit. This
# makes the habit a mechanism.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # package.json requires >=22
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      # The full chain, exactly as package.json defines it. Nothing is listed
      # here by hand: a gate that is in the chain runs, a gate that is not does
      # not — and that stays true without this file being kept in sync.
      - name: Full CI chain
        run: npm run ci:full
