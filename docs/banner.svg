<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" font-family="&#39;JetBrains Mono&#39;, ui-monospace, monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12121a"></stop>
      <stop offset="55%" stop-color="#0c0c11"></stop>
      <stop offset="100%" stop-color="#08080b"></stop>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6c8cff" stop-opacity="0"></stop>
      <stop offset="50%" stop-color="#8aa2ff" stop-opacity=".28"></stop>
      <stop offset="100%" stop-color="#6c8cff" stop-opacity="0"></stop>
    </linearGradient>
    <radialGradient id="frontierAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb638" stop-opacity=".35"></stop>
      <stop offset="55%" stop-color="#f0961e" stop-opacity=".12"></stop>
      <stop offset="100%" stop-color="#f0961e" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"></stop>
      <stop offset="100%" stop-color="#000" stop-opacity=".45"></stop>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eef1ff"></stop>
      <stop offset="50%" stop-color="#fff"></stop>
      <stop offset="100%" stop-color="#c7d0ff"></stop>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <filter id="hardGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.4" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    
    <style>
      /* animation restored — a prior redesign had dropped the keyframe block. */
      @keyframes ringPing    { 0%{transform:scale(1);opacity:.6} 100%{transform:scale(2.8);opacity:0} }
      @keyframes coreBreath  { 0%,100%{transform:scale(1);opacity:.85} 50%{transform:scale(1.6);opacity:.45} }
      @keyframes flow        { 0%{stroke-dashoffset:40} 100%{stroke-dashoffset:0} }
      @keyframes scan        { 0%{transform:translateX(-200px)} 100%{transform:translateX(1000px)} }
      @keyframes dataPulse   { 0%{stroke-dashoffset:960} 100%{stroke-dashoffset:0} }
      @keyframes edgePulse   { 0%,100%{stroke-opacity:.15} 50%{stroke-opacity:.6} }
      @keyframes auraBreath  { 0%,100%{opacity:.55;transform:scale(1)} 50%{opacity:.9;transform:scale(1.12)} }
      @keyframes fringPulse  { 0%,100%{opacity:.7;transform:scale(1)} 50%{opacity:1;transform:scale(1.05)} }
      @keyframes fpingExpand { 0%{transform:scale(1);opacity:.6} 100%{transform:scale(2.4);opacity:0} }
      @keyframes diamondPulse{ 0%,100%{opacity:.85;transform:scale(1)} 50%{opacity:1;transform:scale(1.15)} }
      .thread { animation:flow 3s linear infinite }
      .t2     { animation-delay:1s }
      .t3     { animation-delay:2s }
      .scan   { animation:scan 5s linear infinite }
      .pulse  { animation:dataPulse 2.4s linear infinite }
      .edge   { animation:edgePulse 2.6s ease-in-out infinite }
      .aura   { transform-origin:400px 78px; animation:auraBreath 4s ease-in-out infinite }
      .fring  { transform-origin:400px 78px; animation:fringPulse 4s ease-in-out infinite }
      .fping  { transform-origin:400px 78px; animation:fpingExpand 3s ease-out infinite }
      .diamond{ transform-origin:400px 74px; animation:diamondPulse 4.5s ease-in-out infinite }
      @media (prefers-reduced-motion:reduce) {
        .thread,.scan,.pulse,.edge,.aura,.fring,.fping,.diamond,
        [style*="ringPing"],[style*="coreBreath"] { animation:none !important }
      }
    </style>
  </defs>

  <rect width="800" height="200" fill="url(#bgGrad)" rx="12"></rect>

  <g stroke="#6c8cff" stroke-width=".35" opacity=".06">
    <line x1="0" y1="50" x2="800" y2="50"></line><line x1="0" y1="100" x2="800" y2="100"></line><line x1="0" y1="150" x2="800" y2="150"></line>
    <line x1="160" y1="0" x2="160" y2="200"></line><line x1="320" y1="0" x2="320" y2="200"></line><line x1="480" y1="0" x2="480" y2="200"></line><line x1="640" y1="0" x2="640" y2="200"></line>
  </g>

  <g fill="none" stroke="#6c8cff" stroke-width="1" stroke-dasharray="4 6" filter="url(#softGlow)">
    <path class="thread" d="M0,100 Q200,40 400,100 T800,100"></path>
    <path class="thread t2" stroke="#8aa2ff" d="M0,80 Q200,140 400,80 T800,80"></path>
    <path class="thread t3" stroke="#5c7cf0" d="M0,120 Q200,60 400,120 T800,120"></path>
  </g>

  <rect class="scan" x="-200" y="0" width="200" height="200" fill="url(#scanGrad)"></rect>

  <g stroke="#6c8cff" stroke-width=".7" opacity=".4" stroke-linecap="round">
    <line x1="80" y1="60" x2="200" y2="90"></line><line x1="200" y1="90" x2="340" y2="55"></line><line x1="340" y1="55" x2="460" y2="85"></line><line x1="460" y1="85" x2="600" y2="50"></line><line x1="600" y1="50" x2="720" y2="75"></line>
    <line x1="80" y1="140" x2="200" y2="110"></line><line x1="200" y1="110" x2="340" y2="145"></line><line x1="340" y1="145" x2="460" y2="115"></line><line x1="460" y1="115" x2="600" y2="150"></line><line x1="600" y1="150" x2="720" y2="125"></line>
    <line x1="200" y1="90" x2="200" y2="110"></line><line x1="340" y1="55" x2="340" y2="145"></line><line x1="460" y1="85" x2="460" y2="115"></line><line x1="600" y1="50" x2="600" y2="150"></line><line x1="80" y1="60" x2="80" y2="140"></line><line x1="720" y1="75" x2="720" y2="125"></line>
    <line x1="80" y1="60" x2="340" y2="145" opacity=".5"></line><line x1="200" y1="110" x2="460" y2="85" opacity=".5"></line><line x1="340" y1="55" x2="600" y2="150" opacity=".5"></line><line x1="460" y1="115" x2="720" y2="75" opacity=".5"></line>
  </g>

  <line class="pulse" x1="80" y1="100" x2="720" y2="100" stroke="#8aa2ff" stroke-width="1.6" stroke-dasharray="60 900" filter="url(#hardGlow)"></line>

  <g fill="none" stroke="#ffb638" stroke-width="1.1" stroke-dasharray="6 8" filter="url(#softGlow)">
    <line class="edge" x1="400" y1="78" x2="200" y2="90"></line>
    <line class="edge" style="animation-delay:.4s" x1="400" y1="78" x2="600" y2="50"></line>
    <line class="edge" style="animation-delay:.8s" x1="400" y1="78" x2="340" y2="145"></line>
    <line class="edge" style="animation-delay:1.2s" x1="400" y1="78" x2="460" y2="115"></line>
    <line class="edge" style="animation-delay:1.6s" x1="400" y1="78" x2="600" y2="150"></line>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="80" cy="60" r="8" fill="#6c8cff" fill-opacity=".14"></circle><circle cx="80" cy="60" r="8" fill="none" stroke="#6c8cff" style="transform-origin:80px 60px;animation:ringPing 5s ease-out infinite"></circle><circle cx="80" cy="60" r="2.5" fill="#aab8ff" style="transform-origin:80px 60px;animation:coreBreath 4s ease-in-out infinite"></circle>
    <circle cx="720" cy="75" r="7" fill="#6c8cff" fill-opacity=".14"></circle><circle cx="720" cy="75" r="7" fill="none" stroke="#6c8cff" style="transform-origin:720px 75px;animation:ringPing 5s ease-out infinite 1.1s"></circle><circle cx="720" cy="75" r="2" fill="#aab8ff" style="transform-origin:720px 75px;animation:coreBreath 4s ease-in-out infinite .6s"></circle>
    <circle cx="80" cy="140" r="6" fill="#6c8cff" fill-opacity=".14"></circle><circle cx="80" cy="140" r="6" fill="none" stroke="#6c8cff" style="transform-origin:80px 140px;animation:ringPing 5s ease-out infinite 2.2s"></circle><circle cx="80" cy="140" r="2" fill="#aab8ff" style="transform-origin:80px 140px;animation:coreBreath 4s ease-in-out infinite 1.3s"></circle>
    <circle cx="720" cy="125" r="8" fill="#6c8cff" fill-opacity=".14"></circle><circle cx="720" cy="125" r="8" fill="none" stroke="#6c8cff" style="transform-origin:720px 125px;animation:ringPing 5s ease-out infinite 3.3s"></circle><circle cx="720" cy="125" r="2.5" fill="#aab8ff" style="transform-origin:720px 125px;animation:coreBreath 4s ease-in-out infinite 1.9s"></circle>
    <circle cx="460" cy="85" r="12" fill="#6c8cff" fill-opacity=".12"></circle><circle cx="460" cy="85" r="12" fill="none" stroke="#6c8cff" style="transform-origin:460px 85px;animation:ringPing 5s ease-out infinite .5s"></circle><circle cx="460" cy="85" r="3.5" fill="#aab8ff" style="transform-origin:460px 85px;animation:coreBreath 4s ease-in-out infinite .2s"></circle>
    <circle cx="200" cy="110" r="8" fill="#6c8cff" fill-opacity=".14"></circle><circle cx="200" cy="110" r="8" fill="none" stroke="#6c8cff" style="transform-origin:200px 110px;animation:ringPing 5s ease-out infinite 2.6s"></circle><circle cx="200" cy="110" r="2.5" fill="#aab8ff" style="transform-origin:200px 110px;animation:coreBreath 4s ease-in-out infinite 1.5s"></circle>
    <circle cx="460" cy="115" r="6" fill="#6c8cff" fill-opacity=".14"></circle><circle cx="460" cy="115" r="6" fill="none" stroke="#6c8cff" style="transform-origin:460px 115px;animation:ringPing 5s ease-out infinite 3.9s"></circle><circle cx="460" cy="115" r="2" fill="#aab8ff" style="transform-origin:460px 115px;animation:coreBreath 4s ease-in-out infinite 2.4s"></circle>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="200" cy="90" r="10" fill="#ffb638" fill-opacity=".12"></circle><circle cx="200" cy="90" r="10" fill="none" stroke="#ffb638" style="transform-origin:200px 90px;animation:ringPing 5.5s ease-out infinite .3s"></circle><circle cx="200" cy="90" r="3" fill="#ffcf7a" style="transform-origin:200px 90px;animation:coreBreath 3.6s ease-in-out infinite"></circle>
    <circle cx="340" cy="55" r="7" fill="#ffb638" fill-opacity=".12"></circle><circle cx="340" cy="55" r="7" fill="none" stroke="#ffb638" style="transform-origin:340px 55px;animation:ringPing 5.5s ease-out infinite 1.4s"></circle><circle cx="340" cy="55" r="2.5" fill="#ffcf7a" style="transform-origin:340px 55px;animation:coreBreath 3.6s ease-in-out infinite .7s"></circle>
    <circle cx="600" cy="50" r="9" fill="#ffb638" fill-opacity=".12"></circle><circle cx="600" cy="50" r="9" fill="none" stroke="#ffb638" style="transform-origin:600px 50px;animation:ringPing 5.5s ease-out infinite 2.5s"></circle><circle cx="600" cy="50" r="2.8" fill="#ffcf7a" style="transform-origin:600px 50px;animation:coreBreath 3.6s ease-in-out infinite 1.1s"></circle>
    <circle cx="340" cy="145" r="11" fill="#ffb638" fill-opacity=".12"></circle><circle cx="340" cy="145" r="11" fill="none" stroke="#ffb638" style="transform-origin:340px 145px;animation:ringPing 5.5s ease-out infinite 3.6s"></circle><circle cx="340" cy="145" r="3.2" fill="#ffcf7a" style="transform-origin:340px 145px;animation:coreBreath 3.6s ease-in-out infinite 1.8s"></circle>
    <circle cx="600" cy="150" r="10" fill="#ffb638" fill-opacity=".12"></circle><circle cx="600" cy="150" r="10" fill="none" stroke="#ffb638" style="transform-origin:600px 150px;animation:ringPing 5.5s ease-out infinite 4.5s"></circle><circle cx="600" cy="150" r="3" fill="#ffcf7a" style="transform-origin:600px 150px;animation:coreBreath 3.6s ease-in-out infinite 2.3s"></circle>
  </g>

  <circle class="aura" cx="400" cy="78" r="34" fill="url(#frontierAura)"></circle>
  <g filter="url(#hardGlow)">
    <circle cx="400" cy="78" r="14" fill="#f0961e" fill-opacity=".16"></circle>
    <circle class="fring" cx="400" cy="78" r="14" fill="none" stroke="#ffb638" stroke-width="1.4"></circle>
    <circle class="fping" cx="400" cy="78" r="14" fill="none" stroke="#ffb638" stroke-width="1.2"></circle>
    <circle cx="400" cy="78" r="4" fill="#ffe0a8"></circle>
    <polygon class="diamond" points="400,68 406,74 400,80 394,74" fill="#0c0c11" stroke="#ffcf7a" stroke-width="1"></polygon>
  </g>

  <text class="title" x="400" y="114" text-anchor="middle" fill="url(#titleGrad)" filter="url(#softGlow)" font-family="&#39;Space Grotesk&#39;, sans-serif" font-weight="700" font-size="26" letter-spacing="8">GENESIS</text>
  <text x="400" y="132" text-anchor="middle" fill="#8aa2ff" font-weight="500" font-size="8" letter-spacing="4.5">SELF-MODIFYING COGNITIVE AI AGENT</text>
  <line x1="250" y1="142" x2="550" y2="142" stroke="#6c8cff" stroke-width=".4" opacity=".35"></line>
  <text x="400" y="157" text-anchor="middle" fill="#6f727e" font-size="7" letter-spacing="1.5">v7.9.49 · 444 modules · 185 services · 9538 tests · 12 boot phases</text>
  <text x="400" y="178" text-anchor="middle" fill="#c79a4e" font-weight="500" font-size="8" letter-spacing="3">PERCEIVE · PLAN · ACT · VERIFY · LEARN · DREAM · EVOLVE · REMEMBER</text>

  <rect width="800" height="200" fill="url(#vignette)" rx="12" pointer-events="none"></rect>
  <rect x=".5" y=".5" width="799" height="199" fill="none" stroke="#6c8cff" stroke-opacity=".18" rx="12"></rect>
</svg>