       21:26 on 2026-03-20, the March equinox. Hour hand at 283deg, minute
       hand at 156deg. Colors match docs/banner.svg accents. -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#6c8cff" stroke-width="4.5"/>
  <g stroke="#ffb638" stroke-width="4.5" stroke-linecap="round">
    <line x1="32" y1="32" x2="21.3" y2="29.5"/>
    <line x1="32" y1="32" x2="38.9" y2="47.5"/>
  </g>
  <circle cx="32" cy="32" r="4.5" fill="#6c8cff"/>
</svg>
